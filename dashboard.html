<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body style="font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto;">
  <h2>User Dashboard</h2>
  <p id="welcome">Loading user details...</p>
  
  <!-- This is where your special 4-character code will show up [1.1.1] -->
  <h3 id="codeDisplay" style="color: green; background: #e2fcd4; padding: 10px; border-radius: 4px;">Code: Loading...</h3>
  
  <button id="logoutBtn" style="padding: 10px; background-color: red; color: white; border: none; cursor: pointer;">Log Out</button>

  <!-- Firebase Compat SDKs (Must match your index.html) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD3J5lufLU7BnB0tCPrJyema0Vj1q7283I",
      authDomain: "smartbin-login.firebaseapp.com",
      projectId: "smartbin-login",
      storageBucket: "smartbin-login.firebasestorage.app",
      messagingSenderId: "304365155248",
      appId: "AIzaSyD3J5lufLU7BnB0tCPrJyema0Vj1q7283I"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const welcomeEl = document.getElementById("welcome");
    const codeDisplayEl = document.getElementById("codeDisplay");

    // 2. This is the onAuthStateChanged block that protects your page! [1.1.8]
    auth.onAuthStateChanged((user) => {
      if (user) {
        // User is logged in! Update the page.
        welcomeEl.textContent = "Welcome back, " + user.email;
        
        // Show their unique 4-character code from their profile [1.1.1]
        codeDisplayEl.textContent = "Your Special Code: " + (user.displayName || "None");
      } else {
        // No user is logged in, instantly kick them back to login page [1.1.8]
        window.location.href = "index.html";
      }
    });

    // 3. Log out functionality
    document.getElementById("logoutBtn").onclick = function() {
      auth.signOut()
        .then(() => {
          // Once signed out, onAuthStateChanged triggers and redirects back [1.1.8]
        })
        .catch((error) => alert(error.message));
    };
  </script>
</body>
</html>
